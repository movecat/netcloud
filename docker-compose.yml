services:
  kcloud-ssr:
    build:
      context: .
    image: ${KCLOUD_IMAGE:-kcloud-ssr:legacy}
    container_name: ${KCLOUD_CONTAINER_NAME:-kcloud-ssr}
    network_mode: host
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
        max-file: ${DOCKER_LOG_MAX_FILE:-3}
    env_file:
      - .env
    volumes:
      - ./data:/data
      - ./logs:/var/log/kcloud
